    <path d="M0 305h874v147H0z" fill="#8c9499"/><path d="M206 96h430q100 0 170 150l-100 90H120z" fill="#9fb2bd"/><rect x="260" y="146" width="210" height="104" fill="#cee6f0"/><path d="M106 336h660" stroke="#253039" stroke-width="40"/><circle cx="260" cy="350" r="62" fill="#1d252c"/><circle cx="640" cy="350" r="62" fill="#1d252c"/><path d="M520 126l180-96" stroke="#111" stroke-width="20"/><circle cx="70" cy="70" r="58" class="photoN"/><text x="50" y="94" class="num">2</text>
