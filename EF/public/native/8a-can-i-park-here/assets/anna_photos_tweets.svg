<svg xmlns="http://www.w3.org/2000/svg" width="2360" height="2360" viewBox="0 0 2360 2360" role="img" aria-label="Anna's driving photos and tweets">
  <defs>
    <style>.title{font:700 76px Arial,Helvetica,sans-serif;fill:#222}.num{font:900 70px Arial;fill:#111}.tweetName{font:800 52px Arial;fill:#222}.tweet{font:500 50px Arial;fill:#3b3b3b}.muted{fill:#9ba6aa}.bubble{fill:#eaf1f4;stroke:#d7e0e4;stroke-width:6}.photoN{fill:#e8fbff;stroke:#fff;stroke-width:10}</style>
  </defs>
  <rect width="2360" height="2360" fill="#fff"/>
  <text x="50" y="74" class="title">a</text><text x="188" y="74" class="title">Anna wants to learn to drive. Match her tweets to photos 1-3.</text>
  <g transform="translate(64 150)">
