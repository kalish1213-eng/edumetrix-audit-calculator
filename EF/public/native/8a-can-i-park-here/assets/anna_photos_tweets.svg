    <rect x="160" y="164" width="240" height="182" fill="#c9d6d0"/><rect x="474" y="164" width="240" height="182" fill="#b8d4c7"/><rect x="788" y="164" width="240" height="182" fill="#d6d0b5"/>
    <path d="M210 720q180-180 456-120t420 260v180H210z" fill="#d75a45"/>
    <circle cx="372" cy="470" r="135" fill="#e9b38f"/><path d="M230 435q74-150 240-120 110 20 160 116-130-52-260-12z" fill="#4a2e24"/>
