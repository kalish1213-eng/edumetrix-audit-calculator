  <g transform="translate(210 1260)">
    <rect x="0" y="0" width="2086" height="260" rx="10" class="bubble"/><circle cx="88" cy="74" r="54" fill="#cceef4"/><text x="58" y="100" font-family="Arial" font-size="70" fill="#11343d">A</text><circle cx="230" cy="105" r="58" fill="#e9b38f"/><path d="M178 92q42-74 116-30 36 22 44 70-80-38-160-4z" fill="#4a2e24"/><text x="340" y="88" class="tweetName">Anna Jones <tspan class="muted">@annaj • Jul 19</tspan></text><text x="340" y="166" class="tweet">Dad's a terrible teacher. I need some practical lessons</text><text x="340" y="226" class="tweet">with a GOOD driving instructor! Friends, can you help?</text>
  </g>
  <g transform="translate(210 1590)">
    <rect x="0" y="0" width="2086" height="300" rx="10" class="bubble"/><circle cx="88" cy="74" r="54" fill="#cceef4"/><text x="58" y="100" font-family="Arial" font-size="70" fill="#11343d">B</text><circle cx="230" cy="105" r="58" fill="#e9b38f"/><path d="M178 92q42-74 116-30 36 22 44 70-80-38-160-4z" fill="#4a2e24"/><text x="340" y="88" class="tweetName">Anna Jones <tspan class="muted">@annaj • Jul 18</tspan></text><text x="340" y="166" class="tweet">A pass in the theory - fantastic! :) My first lesson with</text><text x="340" y="226" class="tweet">Dad - total disaster! :( Now Dad says I can't practise</text><text x="340" y="286" class="tweet">in his car :(.</text>
  </g>
  <g transform="translate(210 1970)">
    <rect x="0" y="0" width="2086" height="300" rx="10" class="bubble"/><circle cx="88" cy="74" r="54" fill="#cceef4"/><text x="58" y="100" font-family="Arial" font-size="70" fill="#11343d">C</text><circle cx="230" cy="105" r="58" fill="#e9b38f"/><path d="M178 92q42-74 116-30 36 22 44 70-80-38-160-4z" fill="#4a2e24"/><text x="340" y="88" class="tweetName">Anna Jones <tspan class="muted">@annaj • Apr 23</tspan></text><text x="340" y="166" class="tweet">The theory test is very difficult. I can practise online,</text><text x="340" y="226" class="tweet">but I can't answer the questions. Help!</text>
  </g>
