<svg xmlns="http://www.w3.org/2000/svg" width="5120" height="2880" viewBox="0 0 5120 2880" role="img" aria-labelledby="title desc">
  <title id="title">Food and drink photos A to E</title>
  <desc id="desc">Five labelled high-resolution vector panels: orange juice, sandwich, eggs, tea, and cheese.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbff"/><stop offset="1" stop-color="#f8f2e8"/></linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f5dfb8"/><stop offset="1" stop-color="#d6a769"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#69451f" flood-opacity=".22"/></filter>
    <style>
      .panel{fill:#fff;stroke:#d7d1c6;stroke-width:14;filter:url(#shadow)}
      .label{font-family:Arial,Helvetica,sans-serif;font-weight:900;font-size:190px;fill:#fff}
      .labelDisk{fill:#d7197a}
      .cap{font-family:Arial,Helvetica,sans-serif;font-weight:900;font-size:118px;fill:#263238}
      .small{font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:72px;fill:#5e6470}
      .plate{fill:#fdfdfd;stroke:#d9dde2;stroke-width:16}
    </style>
  </defs>
  <rect width="5120" height="2880" fill="url(#bg)"/>
  <rect y="2170" width="5120" height="710" fill="url(#table)"/>
  <g transform="translate(170 180)">
    <rect class="panel" width="1440" height="1060" rx="48"/>
    <circle class="labelDisk" cx="140" cy="140" r="92"/><text class="label" x="85" y="205">A</text>
    <rect x="505" y="220" width="360" height="560" rx="50" fill="#f7a927" stroke="#d07900" stroke-width="18"/>
    <rect x="543" y="262" width="284" height="255" rx="36" fill="#ffc766" opacity=".9"/>
    <path d="M600 160c120 90 238 85 352 0" fill="none" stroke="#60a543" stroke-width="28" stroke-linecap="round"/>
    <circle cx="540" cy="170" r="72" fill="#ff9d16"/><circle cx="928" cy="170" r="72" fill="#ff9d16"/>
    <text class="cap" x="370" y="925">orange juice</text>
  </g>
  <g transform="translate(1840 180)">
    <rect class="panel" width="1440" height="1060" rx="48"/>
    <circle class="labelDisk" cx="140" cy="140" r="92"/><text class="label" x="83" y="205">B</text>
    <path d="M350 640l690-360 135 470z" fill="#f2c16d" stroke="#b4742e" stroke-width="18"/>
    <path d="M405 640l650-335 58 205-600 310z" fill="#f8eed8" stroke="#d7c4a7" stroke-width="12"/>
    <path d="M500 575l465-235 30 115-432 225z" fill="#78a944"/>
    <path d="M455 675l645-330 60 210-600 315z" fill="#f4d35c"/>
    <circle cx="760" cy="520" r="28" fill="#d34d36"/><circle cx="890" cy="455" r="24" fill="#d34d36"/>
    <text class="cap" x="410" y="925">sandwich</text>
  </g>
  <g transform="translate(3510 180)">
    <rect class="panel" width="1440" height="1060" rx="48"/>
    <circle class="labelDisk" cx="140" cy="140" r="92"/><text class="label" x="84" y="205">C</text>
    <ellipse class="plate" cx="720" cy="610" rx="470" ry="245"/>
    <ellipse cx="570" cy="580" rx="170" ry="118" fill="#fff8ea" stroke="#e3dacb" stroke-width="12"/>
    <circle cx="570" cy="580" r="64" fill="#ffc33f"/>
    <ellipse cx="825" cy="610" rx="180" ry="125" fill="#fff8ea" stroke="#e3dacb" stroke-width="12"/>
    <circle cx="825" cy="610" r="68" fill="#ffbf37"/>
    <path d="M360 720c290 95 595 92 905 0" stroke="#d89b68" stroke-width="34" stroke-linecap="round" fill="none"/>
    <text class="cap" x="560" y="925">eggs</text>
  </g>
  <g transform="translate(1010 1560)">
    <rect class="panel" width="1440" height="1060" rx="48"/>
    <circle class="labelDisk" cx="140" cy="140" r="92"/><text class="label" x="80" y="205">D</text>
    <path d="M495 360h470v295c0 170-118 290-270 290s-270-120-270-290V430c0-39 31-70 70-70z" fill="#fdfdfb" stroke="#5a8798" stroke-width="18"/>
    <path d="M470 455h445v160c0 110-90 200-200 200h-45c-110 0-200-90-200-200z" fill="#ba6a3a"/>
    <path d="M955 480h120c118 0 118 225-5 225h-112" fill="none" stroke="#5a8798" stroke-width="44" stroke-linecap="round"/>
    <path d="M555 260c-60-90 70-110 10-210M710 260c-60-90 70-110 10-210M865 260c-60-90 70-110 10-210" fill="none" stroke="#bcc9d0" stroke-width="28" stroke-linecap="round"/>
    <text class="cap" x="610" y="925">tea</text>
  </g>
  <g transform="translate(2680 1560)">
    <rect class="panel" width="1440" height="1060" rx="48"/>
    <circle class="labelDisk" cx="140" cy="140" r="92"/><text class="label" x="87" y="205">E</text>
    <ellipse class="plate" cx="720" cy="690" rx="470" ry="205"/>
    <path d="M470 355l540 110-110 315-540-110z" fill="#ffd84f" stroke="#d3a522" stroke-width="18"/>
    <path d="M600 420l540 110-110 315-540-110z" fill="#f4bd36" stroke="#bd8c17" stroke-width="18"/>
    <circle cx="760" cy="560" r="28" fill="#d79522"/><circle cx="920" cy="602" r="24" fill="#d79522"/><circle cx="680" cy="685" r="22" fill="#d79522"/>
    <text class="cap" x="535" y="925">cheese</text>
  </g>
</svg>
