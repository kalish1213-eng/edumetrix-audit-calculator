<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1850 390" width="1850" height="390" role="img" aria-labelledby="title desc">
  <title id="title">In, under, on</title>
  <desc id="desc">Three pictures showing a ball on, under, and in a box.</desc>
  <rect width="1850" height="390" fill="#fff"/>
  <g font-family="Arial" font-weight="900" text-anchor="middle">
    <g transform="translate(80 30)">
      <text x="45" y="70" font-size="62" fill="#d41478">1</text>
      <rect x="205" y="158" width="285" height="150" rx="12" fill="#c98b4a"/>
      <circle cx="347" cy="105" r="58" fill="#f4c62f" stroke="#333" stroke-width="8"/>
      <text x="347" y="365" font-size="44" fill="#555">on</text>
    </g>
    <g transform="translate(665 30)">
      <text x="45" y="70" font-size="62" fill="#d41478">2</text>
      <rect x="205" y="105" width="285" height="150" rx="12" fill="#c98b4a"/>
      <circle cx="347" cy="315" r="58" fill="#f4c62f" stroke="#333" stroke-width="8"/>
      <text x="347" y="365" font-size="44" fill="#555">under</text>
    </g>
    <g transform="translate(1250 30)">
      <text x="45" y="70" font-size="62" fill="#d41478">3</text>
      <rect x="205" y="115" width="285" height="190" rx="12" fill="#c98b4a"/>
      <circle cx="347" cy="205" r="58" fill="#f4c62f" stroke="#333" stroke-width="8"/>
      <rect x="205" y="115" width="285" height="95" rx="12" fill="#d5a06a" opacity=".82"/>
      <text x="347" y="365" font-size="44" fill="#555">in</text>
    </g>
  </g>
</svg>
