      <use href="#badge" x="40" y="38"/><text x="40" y="58" font-size="48" fill="#d41478">6</text>
      <rect x="120" y="180" width="390" height="210" rx="28" fill="#5c3a2a"/>
      <rect x="165" y="220" width="300" height="118" rx="18" fill="#80543b"/>
