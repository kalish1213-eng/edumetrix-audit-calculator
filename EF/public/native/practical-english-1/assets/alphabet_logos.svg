<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
  <title id="title">Alphabet logo letter practice</title>
  <desc id="desc">Vector practice cards for VIP, CNN, FBI, BBC, ATM, USB, BMW, and EU.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#3d3320" flood-opacity=".18"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f3ead0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="460" rx="28" fill="#f7f1df"/>
  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
    <g transform="translate(40 40)">
      <rect width="270" height="170" rx="18" fill="#163d8f"/>
      <text x="135" y="113" font-size="82" fill="#fff">VIP</text>
    </g>
    <g transform="translate(350 40)">
      <rect width="270" height="170" rx="18" fill="#c82128"/>
      <text x="135" y="113" font-size="82" fill="#fff">CNN</text>
    </g>
    <g transform="translate(660 40)">
      <rect width="270" height="170" rx="18" fill="url(#paper)" stroke="#243656" stroke-width="6"/>
      <text x="135" y="113" font-size="82" fill="#20335d">FBI</text>
    </g>
    <g transform="translate(970 40)">
      <rect width="270" height="170" rx="18" fill="#0f2f79"/>
      <circle cx="73" cy="85" r="54" fill="#fff"/>
      <circle cx="135" cy="85" r="54" fill="#fff"/>
      <circle cx="197" cy="85" r="54" fill="#fff"/>
      <text x="73" y="106" font-size="58" fill="#0f2f79">B</text>
      <text x="135" y="106" font-size="58" fill="#0f2f79">B</text>
      <text x="197" y="106" font-size="58" fill="#0f2f79">C</text>
    </g>
    <g transform="translate(40 250)">
      <rect width="270" height="170" rx="18" fill="#1d2836"/>
      <text x="135" y="113" font-size="82" fill="#fff">ATM</text>
    </g>
    <g transform="translate(350 250)">
      <rect width="270" height="170" rx="18" fill="#fff" stroke="#2f6bb2" stroke-width="6"/>
      <text x="135" y="113" font-size="82" fill="#2f6bb2">USB</text>
    </g>
    <g transform="translate(660 250)">
      <rect width="270" height="170" rx="18" fill="#101010"/>
      <circle cx="80" cy="85" r="52" fill="#fff"/>
      <circle cx="135" cy="85" r="52" fill="#fff"/>
      <circle cx="190" cy="85" r="52" fill="#fff"/>
      <text x="80" y="105" font-size="52" fill="#111">B</text>
      <text x="135" y="105" font-size="52" fill="#111">M</text>
      <text x="190" y="105" font-size="52" fill="#111">W</text>
    </g>
    <g transform="translate(970 250)">
      <rect width="270" height="170" rx="18" fill="#1d57a6"/>
      <circle cx="95" cy="85" r="50" fill="#f4d43f"/>
      <circle cx="175" cy="85" r="50" fill="#f4d43f"/>
      <text x="95" y="106" font-size="60" fill="#1d57a6">E</text>
      <text x="175" y="106" font-size="60" fill="#1d57a6">U</text>
    </g>
  </g>
</svg>
