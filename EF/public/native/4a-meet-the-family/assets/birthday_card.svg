<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900" role="img" aria-labelledby="title desc">
  <title id="title">Jane's birthday card</title>
  <desc id="desc">A birthday card with family names for a listening activity.</desc>
  <rect width="1300" height="900" rx="36" fill="#fff7fb"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="90" y="80" width="1120" height="740" rx="34" fill="#fff" stroke="#d7197a" stroke-width="10"/>
    <rect x="90" y="80" width="1120" height="150" rx="34" fill="#d7197a"/>
    <text x="650" y="178" font-size="68" font-weight="900" fill="#fff" text-anchor="middle">Happy Birthday, Jane!</text>
    <g font-weight="900" text-anchor="middle">
      <circle cx="250" cy="350" r="72" fill="#f4aa39"/><text x="250" y="375" font-size="74" fill="#fff">1</text>
      <circle cx="505" cy="350" r="72" fill="#1260a8"/><text x="505" y="375" font-size="74" fill="#fff">2</text>
      <circle cx="760" cy="350" r="72" fill="#208842"/><text x="760" y="375" font-size="74" fill="#fff">3</text>
      <circle cx="1015" cy="350" r="72" fill="#bd242b"/><text x="1015" y="375" font-size="74" fill="#fff">4</text>
    </g>
    <g font-size="44" font-weight="900" fill="#19191b" text-anchor="middle">
      <text x="250" y="485">Paul</text>
      <text x="505" y="485">Nicole</text>
      <text x="760" y="485">Sally</text>
      <text x="1015" y="485">Max</text>
    </g>
    <g font-size="34" fill="#555" text-anchor="middle">
      <text x="250" y="535">brother</text>
      <text x="505" y="535">sister</text>
      <text x="760" y="535">mother</text>
      <text x="1015" y="535">father</text>
    </g>
    <path d="M210 650c120-80 260-80 380 0s260 80 380 0" fill="none" stroke="#f4aa39" stroke-width="18" stroke-linecap="round"/>
    <text x="650" y="760" font-size="48" font-weight="900" fill="#d7197a" text-anchor="middle">Lots of love from your family</text>
  </g>
</svg>
