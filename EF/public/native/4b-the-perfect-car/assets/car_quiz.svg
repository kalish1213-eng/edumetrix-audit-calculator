<svg xmlns="http://www.w3.org/2000/svg" width="4096" height="2304" viewBox="0 0 4096 2304" role="img" aria-labelledby="title desc">
  <title id="title">Car brand quiz cards</title>
  <desc id="desc">Six clean vector cards with car names and simplified badge-style illustrations.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f3f0e8"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e84736"/>
      <stop offset="1" stop-color="#9b1e1a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4d86cf"/>
      <stop offset="1" stop-color="#143e72"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe28a"/>
      <stop offset="1" stop-color="#c7861d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0d1720" flood-opacity=".18"/>
    </filter>
    <style>
      .card{fill:url(#paper);stroke:#242424;stroke-width:6;filter:url(#shadow)}
      .num{font:800 96px Arial,Helvetica,sans-serif;fill:#151515}
      .brand{font:800 116px Arial,Helvetica,sans-serif;letter-spacing:0;fill:#121212}
      .hint{font:600 42px Arial,Helvetica,sans-serif;fill:#6f6a60}
      .line{fill:none;stroke:#1b1b1b;stroke-width:20;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#1b1b1b;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="4096" height="2304" fill="#ece7dd"/>
  <g transform="translate(136 128)">
    <g transform="translate(0 0)">
      <rect class="card" width="1190" height="610" rx="38"/>
      <text class="num" x="68" y="128">1</text>
      <circle cx="596" cy="292" r="152" fill="url(#gold)" stroke="#171717" stroke-width="12"/>
      <path class="line" d="M472 322c86-94 162-130 274-132-42 34-68 72-87 118 42 2 86 14 128 40-104 30-210 25-315-26z"/>
      <text class="brand" x="596" y="520" text-anchor="middle">Jaguar</text>
    </g>
    <g transform="translate(1453 0)">
      <rect class="card" width="1190" height="610" rx="38"/>
      <text class="num" x="68" y="128">2</text>
      <path d="M412 235h118l62-72 64 72h124v128H658l-64 72-64-72H412z" fill="url(#gold)" stroke="#151515" stroke-width="14" stroke-linejoin="round"/>
      <text class="brand" x="596" y="520" text-anchor="middle">Chevrolet</text>
    </g>
    <g transform="translate(2906 0)">
      <rect class="card" width="1054" height="610" rx="38"/>
      <text class="num" x="68" y="128">3</text>
      <circle cx="527" cy="288" r="166" fill="#f7f7f3" stroke="#171717" stroke-width="16"/>
      <path class="line" d="M527 132v160M527 292 386 386M527 292l141 94"/>
      <text class="brand" x="527" y="520" text-anchor="middle">Mercedes</text>
    </g>
    <g transform="translate(0 826)">
      <rect class="card" width="1190" height="610" rx="38"/>
      <text class="num" x="68" y="128">4</text>
      <path d="M596 130c112 54 184 146 172 254-98 46-244 46-344 0-10-108 62-200 172-254z" fill="url(#blue)" stroke="#141414" stroke-width="14"/>
      <path class="thin" d="M520 352c74-46 122-98 142-156M565 242c38 24 78 32 122 20"/>
      <text class="brand" x="596" y="520" text-anchor="middle">Peugeot</text>
    </g>
    <g transform="translate(1453 826)">
      <rect class="card" width="1190" height="610" rx="38"/>
      <text class="num" x="68" y="128">5</text>
      <path d="M488 132h216c46 0 84 38 84 84v246H404V216c0-46 38-84 84-84z" fill="url(#red)" stroke="#161616" stroke-width="14"/>
      <path d="M474 202h244v184H474z" fill="#ffe992" stroke="#161616" stroke-width="10"/>
      <path class="thin" d="M512 340c52-78 116-112 190-104M604 238v104"/>
      <text class="brand" x="596" y="520" text-anchor="middle">Ferrari</text>
    </g>
    <g transform="translate(2906 826)">
      <rect class="card" width="1054" height="610" rx="38"/>
      <text class="num" x="68" y="128">6</text>
      <rect x="346" y="132" width="362" height="310" rx="92" fill="#f7f7f3" stroke="#161616" stroke-width="16"/>
      <path class="line" d="M436 392V186M618 186v206M436 286h182"/>
      <text class="brand" x="527" y="520" text-anchor="middle">Honda</text>
    </g>
  </g>
  <text class="hint" x="2048" y="2184" text-anchor="middle">Look at the car names and write the answers.</text>
</svg>
