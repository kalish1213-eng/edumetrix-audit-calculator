<svg xmlns="http://www.w3.org/2000/svg" width="4096" height="3072" viewBox="0 0 4096 3072" role="img" aria-labelledby="title desc">
  <title id="title">Turkish, American, Chinese, and Swiss neutral clues</title>
  <desc id="desc">Four original photo-style clue cards for Turkish delight, an American postcard, Chinese New Year, and the Swiss Alps. No real brands or logos are used.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#12330f" flood-opacity=".22"/>
    </filter>
    <linearGradient id="label" x1="0" x2="1">
      <stop stop-color="#0f172a" stop-opacity=".82"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity=".48"/>
    </linearGradient>
  </defs>
  <rect width="4096" height="3072" fill="#f6f2ec"/>
  <image href="nationality_clues_photo.webp" x="70" y="70" width="3956" height="2932" preserveAspectRatio="xMidYMid slice" filter="url(#shadow)"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="900">
    <g transform="translate(110 110)">
      <circle cx="88" cy="88" r="58" fill="#c81f32"/>
      <text x="88" y="118" text-anchor="middle" font-size="82" fill="#fff">1</text>
      <rect x="0" y="2320" width="1860" height="260" rx="56" fill="url(#label)"/>
      <text x="930" y="2490" text-anchor="middle" font-size="138" fill="#fff">TURKISH DELIGHT</text>
    </g>
    <g transform="translate(2110 110)">
      <circle cx="88" cy="88" r="58" fill="#1f5aa8"/>
      <text x="88" y="118" text-anchor="middle" font-size="82" fill="#fff">2</text>
      <rect x="0" y="2320" width="1860" height="260" rx="56" fill="url(#label)"/>
      <text x="930" y="2490" text-anchor="middle" font-size="132" fill="#fff">AMERICAN POSTCARD</text>
    </g>
    <g transform="translate(110 1572)">
      <circle cx="88" cy="88" r="58" fill="#b81924"/>
      <text x="88" y="118" text-anchor="middle" font-size="82" fill="#fff">3</text>
      <rect x="0" y="1120" width="1860" height="260" rx="56" fill="url(#label)"/>
      <text x="930" y="1290" text-anchor="middle" font-size="134" fill="#fff">CHINESE NEW YEAR</text>
    </g>
    <g transform="translate(2110 1572)">
      <circle cx="88" cy="88" r="58" fill="#d52b1e"/>
      <text x="88" y="118" text-anchor="middle" font-size="82" fill="#fff">4</text>
      <rect x="0" y="1120" width="1860" height="260" rx="56" fill="url(#label)"/>
      <text x="930" y="1290" text-anchor="middle" font-size="148" fill="#fff">SWISS ALPS</text>
    </g>
  </g>
</svg>
