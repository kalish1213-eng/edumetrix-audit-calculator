<svg xmlns="http://www.w3.org/2000/svg" width="4300" height="2900" viewBox="0 0 4300 2900" role="img" aria-labelledby="title desc">
  <title id="title">Town map with streets and buildings</title>
  <desc id="desc">A sharp vector town map showing hospital, train station, hotel, school, car park, bank, gym, factory, Italian restaurant, cinema, supermarket, bookshop, and four labelled blanks A to D.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="8" dy="10" stdDeviation="8" flood-color="#5b5029" flood-opacity=".22"/></filter>
    <style>
