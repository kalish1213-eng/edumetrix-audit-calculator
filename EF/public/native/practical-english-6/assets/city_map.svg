      .street{font-family:Georgia,'Times New Roman',serif;font-size:82px;font-weight:900;fill:#151515}
      .label{font-family:Georgia,'Times New Roman',serif;font-size:70px;font-weight:900;fill:#151515}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:38px;font-weight:800;fill:#222}
      .blank{fill:#fff;stroke:#bfc4c8;stroke-width:9}
      .pin{fill:#b99832}.pintext{font-family:Arial,Helvetica,sans-serif;font-size:47px;font-weight:900;fill:#fff}
      .ink{stroke:#222;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .building{filter:url(#shadow)}
    </style>
  </defs>
