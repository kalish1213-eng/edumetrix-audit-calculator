<svg xmlns="http://www.w3.org/2000/svg" width="4096" height="4394" viewBox="0 0 4096 4394" role="img" aria-labelledby="title desc">
  <title id="title">Clock reference times</title>
  <desc id="desc">Twelve vector clock faces showing common times.</desc>
  <defs>
    <style>
      .card{fill:#fffdf8;stroke:#cfdde4;stroke-width:8}
      .face{fill:#fff;stroke:#172027;stroke-width:16}
      .hand{stroke:#172027;stroke-width:18;stroke-linecap:round}
      .min{stroke-width:12}
      .num{font:900 88px Arial,Helvetica,sans-serif;fill:#2f7898}
      .label{font:800 56px Arial,Helvetica,sans-serif;fill:#172027}
      .tick{stroke:#172027;stroke-width:8;stroke-linecap:round}
    </style>
  </defs>
  <rect width="4096" height="4394" fill="#edf6f9"/>
  <script type="application/ecmascript"><![CDATA[]]></script>
  <g transform="translate(180 150)">
